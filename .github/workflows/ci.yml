name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download NLTK data
        run: |
          python -c "import nltk; nltk.download('punkt'); nltk.download('stopwords'); nltk.download('wordnet')"

      - name: Lint with ruff
        run: |
          ruff check src/ app/ --output-format=github

      - name: Format check with black
        run: |
          black --check src/ app/

      - name: Import sort check with isort
        run: |
          isort --check-only src/ app/

      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports || true

      - name: Run tests
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing || true

      - name: Validate notebooks (no outputs)
        run: |
          python -c "
import json, sys
for nb_path in ['notebooks/autoencoder_training.ipynb', 'notebooks/clustering.ipynb']:
    try:
        with open(nb_path) as f:
            nb = json.load(f)
        for cell in nb.get('cells', []):
            if cell.get('cell_type') == 'code' and cell.get('outputs'):
                print(f'ERROR: {nb_path} has outputs in cell', file=sys.stderr)
                sys.exit(1)
        print(f'OK: {nb_path} has no outputs')
    except Exception as e:
        print(f'ERROR checking {nb_path}: {e}', file=sys.stderr)
        sys.exit(1)
"

  # Optional: Docker build test
  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t nuve:test . || echo "Dockerfile not found, skipping"
